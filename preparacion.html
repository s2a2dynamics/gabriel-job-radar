<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preparación de candidaturas — Gabriel</title><style>:root{--bg:#08101f;--panel:#111a2f;--line:#263653;--txt:#eef3ff;--mut:#9eabc8;--blue:#8dc1ff;--green:#75e6a4;--amber:#ffd36f;--violet:#c6a8ff}*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:linear-gradient(180deg,#07101d,#0a1222 35%,#0d1426);color:var(--txt)}.w{max-width:1450px;margin:auto;padding:24px}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{margin:0 0 6px;font-size:30px}.mut{color:var(--mut)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select,.btn{background:#0d1730;color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel{background:#111a2f;border:1px solid var(--line);border-radius:15px}.list{padding:10px;max-height:78vh;overflow:auto;position:sticky;top:12px}.job{padding:12px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:7px}.job:hover,.job.active{background:#16223c;border-color:#355076}.job b{display:block}.score{color:var(--green);font-weight:800}.detail{padding:20px}.hero{display:flex;justify-content:space-between;gap:20px}.hero h2{margin:0 0 4px}.pill{display:inline-block;background:#1d2947;padding:5px 8px;border-radius:999px;margin:3px 3px 3px 0}.section{margin-top:22px}.section h3{margin:0 0 8px;font-size:17px}.box{background:#0d1730;border:1px solid var(--line);border-radius:11px;padding:13px;line-height:1.55}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#172441;border:1px solid #2d4168;border-radius:999px;padding:5px 8px}.check label{display:block;padding:6px 0}.pitch{font-size:15px;line-height:1.6;border-left:3px solid var(--violet)}ol,ul{margin:6px 0;padding-left:22px}li{margin:6px 0}.back{padding:9px 11px;border:1px solid var(--line);border-radius:9px}.heroActions{display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}@media(max-width:900px){.grid{grid-template-columns:1fr}.list{position:static;max-height:none}.cols{grid-template-columns:1fr}.hero{flex-direction:column}}</style></head><body><div class="w"><header><div><h1>Centro de preparación de candidaturas</h1><div class="mut">De “me interesa esta oferta” a “sé exactamente cómo competir por ella”.</div></div><div class="heroActions"><a class="back" href="entrevista.html">🎤 Simulador de entrevistas</a><a class="back" href="./">← Radar</a></div></header><div class="toolbar"><select id="filter"><option value="">Todas</option><option value="CV Quant / Scientific">Quant / Scientific</option><option value="CV Data / AI">Data / AI</option></select><button onclick="copyPack()">Copiar resumen de preparación</button><button onclick="print()">Imprimir / guardar PDF</button></div><div class="grid"><div class="panel list" id="list"></div><main class="panel detail" id="detail"><div class="mut">Cargando dossiers…</div></main></div></div><script>let P=[],cur=null;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function key(p){return 'prep-'+p.company+'-'+p.role}function renderList(){let f=$('filter').value,arr=P.filter(x=>!f||x.cv===f);$('list').innerHTML=arr.map(x=>`<div class="job ${cur===x?'active':''}" onclick="show(${P.indexOf(x)})"><b>${esc(x.company)}</b><span>${esc(x.role)}</span><div class="mut">${esc(x.location)} · <span class="score">${x.score}</span></div></div>`).join('')}function show(i){cur=P[i];renderList();let x=cur;let saved=JSON.parse(localStorage.getItem(key(x))||'{}');$('detail').innerHTML=`<div class="hero"><div><h2>${esc(x.company)}</h2><div style="font-size:17px;font-weight:650">${esc(x.role)}</div><div class="mut">${esc(x.location)} · Revisado ${esc(x.checked)}</div><div><span class="pill">${esc(x.status)}</span><span class="pill">${esc(x.cv)}</span><span class="pill score">Score ${x.score}</span></div></div><div class="heroActions"><a class="btn" href="entrevista.html">🎤 Practicar entrevista</a><a class="btn" href="${esc(x.url)}" target="_blank">Abrir oferta oficial ↗</a></div></div><div class="section"><h3>1. Palabras clave ATS</h3><div class="tags">${x.ats_keywords.map(v=>`<span class="tag">${esc(v)}</span>`).join('')}</div></div><div class="section"><h3>2. Cómo adaptar el CV</h3><div class="box"><ul>${x.cv_focus.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div></div><div class="section"><h3>3. Cómo usar TFG y TFM</h3><div class="box">${esc(x.tfg_tfm_angle)}</div></div><div class="section cols"><div><h3>4. Gap principal</h3><div class="box">${esc(x.main_gap)}</div></div><div><h3>5. Cómo responder al gap</h3><div class="box">${esc(x.gap_response)}</div></div></div><div class="section"><h3>6. Pitch de 60 segundos</h3><div class="box pitch">${esc(x.pitch)}</div></div><div class="section cols"><div><h3>7. Preguntas probables</h3><div class="box"><ol>${x.interview_questions.map(v=>`<li>${esc(v)}</li>`).join('')}</ol></div></div><div><h3>8. Preparación técnica</h3><div class="box"><ul>${x.technical_prep.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div></div></div><div class="section"><h3>9. Checklist antes de aplicar</h3><div class="box check">${x.checklist.map((v,j)=>`<label><input type="checkbox" ${saved[j]?'checked':''} onchange="saveCheck(${j},this.checked)"> ${esc(v)}</label>`).join('')}</div></div>`}function saveCheck(i,v){let s=JSON.parse(localStorage.getItem(key(cur))||'{}');s[i]=v;localStorage.setItem(key(cur),JSON.stringify(s))}function copyPack(){if(!cur)return;let x=cur,t=`${x.company} — ${x.role}\nCV: ${x.cv}\nATS: ${x.ats_keywords.join(', ')}\n\nCV:\n- ${x.cv_focus.join('\n- ')}\n\nTFG/TFM: ${x.tfg_tfm_angle}\n\nGap: ${x.main_gap}\nRespuesta: ${x.gap_response}\n\nPitch: ${x.pitch}\n\nPreguntas:\n- ${x.interview_questions.join('\n- ')}\n\nPreparación:\n- ${x.technical_prep.join('\n- ')}`;navigator.clipboard.writeText(t)}$('filter').addEventListener('change',renderList);fetch('data/application-packs.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(x=>{P=x;cur=P[0];renderList();show(0)}).catch(()=>{$('detail').innerHTML='No se pudieron cargar los dossiers.'});</script></body></html>
