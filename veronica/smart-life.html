<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verónica Smart Actions</title><style>body{margin:0;background:#08101f;color:#eef3ff;font:14px system-ui}.w{max-width:1000px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#111a2f;border:1px solid #263653;border-radius:14px;padding:16px}.mut{color:#9eabc8}.fb{display:flex;gap:6px;align-items:center;margin-top:12px;padding-top:9px;border-top:1px dashed #31415f}.fb button{background:#0d1730;color:#eef3ff;border:1px solid #31415f;border-radius:999px;padding:6px 9px}.fb button.on{border-color:#75e6a4}.btn{display:inline-block;padding:9px 11px;border-radius:9px;background:#0d1730;border:1px solid #263653;color:#8dc1ff;text-decoration:none}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><a class="btn" href="smart.html">← Smart Space Radar</a><h1>🎯 Verónica — Next Best Actions</h1><p class="mut">Marca qué acciones te resultan útiles. El sistema aprende localmente tus preferencias sin usar datos privados de bienestar.</p><div id="grid" class="grid"></div></div><script>const K='veronica-action-feedback-v1';let F=JSON.parse(localStorage.getItem(K)||'{}');const A=[{id:'science',title:'🔭 Proyecto científico',text:'30–45 min con Python/Astropy o datos Gaia/TESS para construir evidencia real de interés científico.'},{id:'space',title:'🛰️ Space Engineering',text:'Una sesión sobre ECSS, systems engineering, payloads o un pequeño diseño CubeSat/mission analysis.'},{id:'research',title:'🌌 Research exposure',text:'Revisar una oportunidad de Summer Research, grupo de investigación o posible TFG y ejecutar una microacción concreta.'},{id:'career',title:'🚀 Oportunidad profesional',text:'Revisar una de las oportunidades priorizadas y decidir: aplicar, guardar, preparar CV o descartar con criterio.'},{id:'portfolio',title:'🛠️ Portfolio',text:'Mejorar una evidencia demostrable: repo, notebook, README, simulación, análisis o documentación técnica.'},{id:'balance',title:'📵 Balance',text:'Reservar un bloque de desconexión digital o movimiento/deporte para proteger consistencia y energía.'}];function render(){document.getElementById('grid').innerHTML=[...A].sort((a,b)=>(F[b.id]||0)-(F[a.id]||0)).slice(0,3).map(x=>`<div class="card"><h3>${x.title}</h3><p>${x.text}</p><div class="fb"><span class="mut">¿Te ayuda?</span>${[[1,'👍'],[-1,'👎'],[2,'🔁 Más así']].map(([v,l])=>`<button class="${F[x.id]===v?'on':''}" onclick="vote('${x.id}',${v})">${l}</button>`).join('')}</div></div>`).join('')}window.vote=(id,v)=>{F[id]=F[id]===v?0:v;localStorage.setItem(K,JSON.stringify(F));render()};render();</script></body></html>
