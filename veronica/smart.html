<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verónica Smart Radar</title><style>:root{--p:#111a2f;--l:#263653;--t:#eef3ff;--m:#9eabc8;--b:#8dc1ff;--g:#75e6a4;--v:#c6a8ff}*{box-sizing:border-box}body{margin:0;background:#08101f;color:var(--t);font:14px system-ui}.w{max-width:1280px;margin:auto;padding:24px}a{color:var(--b);text-decoration:none}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 11px;border-radius:9px;background:#0d1730;border:1px solid var(--l)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:15px}.mut{color:var(--m)}.scores{display:flex;gap:6px;flex-wrap:wrap}.score{padding:5px 8px;border-radius:999px;background:#0d1730;border:1px solid var(--l)}.science{color:var(--v)}.fit{color:var(--g)}.fb{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed #31415f}.fb button{background:#0d1730;color:var(--t);border:1px solid #31415f;border-radius:999px;padding:6px 9px}.fb button.on{border-color:var(--g)}.post{display:inline-block;margin-top:8px;padding:8px 10px;background:#173524;border:1px solid #2d7650;border-radius:8px;color:#bff7d2}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><div><h1>🧠🚀 Verónica — Smart Space Radar</h1><div class="mut">Space Engineer + Space Scientist · preferencia personal separada de Fit/Career/Science.</div></div><div><a class="btn" href="index.html">Radar clásico</a> <a class="btn" href="life.html">Life & Career</a> <a class="btn" href="feedback.html">Feedback abierto</a></div></div><h2>⭐ Recomendadas</h2><div id="rec" class="grid"></div><h2>🛰️ Prácticas & empleo</h2><div id="jobs" class="grid"></div><h2>🔭 Summer Research</h2><div id="summer" class="grid"></div><h2>🎓 Másteres</h2><div id="masters" class="grid"></div></div><script>const K='veronica-smart-feedback-v1';let F=JSON.parse(localStorage.getItem(K)||'{}');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const key=(type,id)=>type+':'+id;const pref=(type,id)=>F[key(type,id)]||0;function fb(type,id){let k=key(type,id),v=F[k]||0;return `<div class="fb"><span class="mut">¿Te interesa?</span>${[[1,'👍'],[-1,'👎'],[2,'🔁 Más así']].map(([n,l])=>`<button class="${v===n?'on':''}" onclick="vote('${k}',${n})">${l}</button>`).join('')}</div>`}window.vote=(k,v)=>{F[k]=F[k]===v?0:v;localStorage.setItem(K,JSON.stringify(F));render()};let J=[],R=[],S=[],M=[];const scores=x=>`<div class="scores"><span class="score fit">Fit ${x.fit??'—'}</span><span class="score">Career ${x.career_value??'—'}</span><span class="score science">Science ${x.science_alignment??'—'}</span></div>`;const card=(x,type,id,title,sub,note,url)=>`<div class="card">${scores(x)}<b>${esc(title)}</b><div class="mut">${esc(sub||'')}</div><p>${esc(note||'')}</p>${url?`<a class="post" href="${esc(url)}" target="_blank">Abrir ↗</a>`:''}${fb(type,id)}</div>`;function render(){document.getElementById('rec').innerHTML=[...R].sort((a,b)=>pref('rec',b.rank)-pref('rec',a.rank)||a.rank-b.rank).map(x=>card(x,'rec',x.rank,x.company+' — '+x.role,'',x.why,x.apply_url)).join('');document.getElementById('jobs').innerHTML=[...J].sort((a,b)=>pref('job',b.id)-pref('job',a.id)||(b.fit||0)-(a.fit||0)).slice(0,40).map(x=>card(x,'job',x.id,x.company+' — '+x.role,x.city+' · '+x.family,x.comment,x.apply_url)).join('');document.getElementById('summer').innerHTML=[...S].sort((a,b)=>pref('summer',b.id||b.programme)-pref('summer',a.id||a.programme)||(b.science_alignment||0)-(a.science_alignment||0)).map((x,i)=>card(x,'summer',x.id||i,x.programme,x.institution+' · '+x.location,x.why,x.url)).join('');document.getElementById('masters').innerHTML=[...M].sort((a,b)=>pref('master',b.id||b.programme)-pref('master',a.id||a.programme)||(b.fit||0)-(a.fit||0)).map((x,i)=>card(x,'master',x.id||i,x.programme,x.institution+' · '+x.location,x.why,x.url)).join('')}Promise.all(['opportunities','recommended','summer-research','masters'].map(n=>fetch('data/'+n+'.json?v='+Date.now()).then(r=>r.json()))).then(([j,r,s,m])=>{J=j;R=r;S=s;M=m;render()});</script></body></html>
