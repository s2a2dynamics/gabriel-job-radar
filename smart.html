<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabriel Smart Radar</title><style>:root{--p:#111a2f;--l:#263653;--t:#eef3ff;--m:#9eabc8;--b:#8dc1ff;--g:#75e6a4;--a:#ffd36f}*{box-sizing:border-box}body{margin:0;background:#08101f;color:var(--t);font:14px system-ui}.w{max-width:1250px;margin:auto;padding:24px}a{color:var(--b);text-decoration:none}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{display:inline-block;padding:9px 11px;border-radius:9px;background:#0d1730;border:1px solid var(--l)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--p);border:1px solid var(--l);border-radius:14px;padding:15px}.mut{color:var(--m)}.score{font-size:22px;font-weight:800;color:var(--g)}.fb{display:flex;gap:6px;align-items:center;margin-top:10px;padding-top:9px;border-top:1px dashed #31415f}.fb button{background:#0d1730;color:var(--t);border:1px solid #31415f;border-radius:999px;padding:6px 9px}.fb button.on{border-color:var(--g)}.post{display:inline-block;margin-top:8px;padding:8px 10px;background:#173524;border:1px solid #2d7650;border-radius:8px;color:#bff7d2}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="w"><div class="top"><div><h1>🧠 Gabriel — Smart Career Radar</h1><div class="mut">El Fit sigue siendo objetivo; el feedback solo personaliza el orden local.</div></div><div><a class="btn" href="index.html">Radar clásico</a> <a class="btn" href="life.html">Life & Career</a> <a class="btn" href="feedback.html">Feedback abierto</a></div></div><h2>🎯 Next Best Actions</h2><div id="actions" class="grid"></div><h2>⭐ Recomendadas</h2><div id="rec" class="grid"></div><h2>📚 Oportunidades</h2><div id="jobs" class="grid"></div></div><script>const K='gabriel-smart-feedback-v1';let F=JSON.parse(localStorage.getItem(K)||'{}');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const key=(type,id)=>type+':'+id;function fb(type,id){let k=key(type,id),v=F[k]||0;return `<div class="fb"><span class="mut">¿Te sirve?</span>${[[1,'👍'],[-1,'👎'],[2,'🔁']].map(([n,l])=>`<button class="${v===n?'on':''}" onclick="vote('${k}',${n})">${l}</button>`).join('')}</div>`}window.vote=(k,v)=>{F[k]=F[k]===v?0:v;localStorage.setItem(K,JSON.stringify(F));render()};const pref=(type,id)=>F[key(type,id)]||0;let D=[],R=[],A=[];function render(){let actions=[...A].sort((a,b)=>pref('action',b.priority)-pref('action',a.priority)||a.priority-b.priority);document.getElementById('actions').innerHTML=actions.map(x=>`<div class="card"><b>${esc(x.company)} — ${esc(x.role)}</b><p>${esc(x.why_now)}</p>${x.apply_url?`<a class="post" href="${esc(x.apply_url)}" target="_blank">Abrir ↗</a>`:''}${fb('action',x.priority)}</div>`).join('');let rec=[...R].sort((a,b)=>pref('rec',b.rank)-pref('rec',a.rank)||a.rank-b.rank);document.getElementById('rec').innerHTML=rec.map(x=>`<div class="card"><div class="score">${esc(x.score||x.fit||'')}</div><b>${esc(x.company)} — ${esc(x.role)}</b><p>${esc(x.why)}</p>${x.apply_url?`<a class="post" href="${esc(x.apply_url)}" target="_blank">Abrir ↗</a>`:''}${fb('rec',x.rank)}</div>`).join('');let jobs=[...D].sort((a,b)=>pref('job',b.id)-pref('job',a.id)||(b.fit||0)-(a.fit||0)).slice(0,40);document.getElementById('jobs').innerHTML=jobs.map(x=>`<div class="card"><div class="score">Fit ${x.fit||0}</div><b>${esc(x.company)} — ${esc(x.role)}</b><div class="mut">${esc(x.city||x.location||'')} · ${esc(x.family||'')}</div><p>${esc(x.comment||'')}</p>${x.apply_url?`<a class="post" href="${esc(x.apply_url)}" target="_blank">Abrir ↗</a>`:''}${fb('job',x.id)}</div>`).join('')}Promise.all([fetch('data/opportunities.json?v='+Date.now()).then(r=>r.json()),fetch('data/recommended.json?v='+Date.now()).then(r=>r.json()),fetch('data/action-plan.json?v='+Date.now()).then(r=>r.json())]).then(([d,r,a])=>{D=d;R=r;A=a.primary_actions||[];render()});</script></body></html>
